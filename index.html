<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enviar mensaje y documento</title>
<style>
  /* ====== ESTILOS (edita colores y tamaños aquí) ====== */
  :root {
    --color-principal: #2563eb;
    --color-fondo: #f3f4f6;
    --color-tarjeta: #ffffff;
    --color-texto: #111827;
    --color-borde: #d1d5db;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--color-fondo);
    color: var(--color-texto);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .tarjeta {
    background: var(--color-tarjeta);
    width: 100%;
    max-width: 560px;
    padding: 28px;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
  }
  h1 { margin-top: 0; font-size: 22px; }
  label { display: block; font-weight: bold; margin: 18px 0 6px; }
  textarea, input[type="email"], input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--color-borde);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
  }
  textarea { min-height: 120px; resize: vertical; }
  button {
    background: var(--color-principal);
    color: #fff;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { opacity: .9; }
  .fila { display: flex; gap: 8px; }
  .fila input { flex: 1; }
  .lista { margin-top: 10px; }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border: 1px solid var(--color-borde);
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .item label { margin: 0; font-weight: normal; display: flex; gap: 8px; align-items: center; flex: 1; }
  .item .quitar { background: #ef4444; padding: 4px 9px; font-size: 13px; }
  .aviso { font-size: 13px; color: #6b7280; margin-top: 6px; }
  #enviar { width: 100%; margin-top: 24px; padding: 14px; font-size: 16px; }
  #error { color: #dc2626; margin-top: 12px; font-size: 14px; display: none; }
</style>
</head>
<body>

<div class="tarjeta">
  <h1>📨 Enviar mensaje y documento</h1>

  <!--
    IMPORTANTE: el correo de abajo (bobin2626@gmail.com) es donde te llegará todo.
    El servicio gratuito FormSubmit se encarga de enviar el correo.
  -->
  <form id="formulario"
        action="https://formsubmit.co/bobin2626@gmail.com"
        method="POST"
        enctype="multipart/form-data">

    <!-- Mensaje -->
    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>

    <!-- Documento -->
    <label for="documento">Documento (opcional)</label>
    <input type="file" id="documento" name="attachment">
    <div class="aviso">Puedes adjuntar PDF, Word, imagen, etc.</div>

    <!-- Destinatarios -->
    <label>Enviar también a:</label>
    <div class="fila">
      <input type="email" id="nuevoCorreo" placeholder="correo@ejemplo.com">
      <button type="button" id="btnAgregar">Agregar</button>
    </div>
    <div class="lista" id="lista"></div>
    <div class="aviso">Marca los correos a los que quieres enviar. Siempre te llegará una copia a ti.</div>

    <!-- Campos ocultos de configuración (no los borres) -->
    <input type="hidden" name="_cc" id="cc" value="">
    <input type="hidden" name="_subject" value="Nuevo mensaje desde mi página web">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <!-- Opcional: página a la que vuelve después de enviar
    <input type="hidden" name="_next" value="https://tusitio.com/gracias.html"> -->

    <div id="error"></div>
    <button type="submit" id="enviar">Enviar</button>
  </form>
</div>

<script>
  // ====== CORREOS GUARDADOS (edita esta lista a tu gusto) ======
  var correos = [
    // { correo: "amigo@gmail.com", marcado: false },
    // { correo: "profesor@gmail.com", marcado: false }
  ];

  var lista = document.getElementById("lista");
  var inputNuevo = document.getElementById("nuevoCorreo");
  var error = document.getElementById("error");

  function mostrarError(texto) {
    error.textContent = texto;
    error.style.display = texto ? "block" : "none";
  }

  function dibujarLista() {
    lista.innerHTML = "";
    correos.forEach(function (c, i) {
      var div = document.createElement("div");
      div.className = "item";

      var label = document.createElement("label");
      var check = document.createElement("input");
      check.type = "checkbox";
      check.checked = c.marcado;
      check.addEventListener("change", function () { c.marcado = check.checked; });
      label.appendChild(check);
      label.appendChild(document.createTextNode(c.correo));

      var quitar = document.createElement("button");
      quitar.type = "button";
      quitar.className = "quitar";
      quitar.textContent = "Quitar";
      quitar.addEventListener("click", function () {
        correos.splice(i, 1);
        dibujarLista();
      });

      div.appendChild(label);
      div.appendChild(quitar);
      lista.appendChild(div);
    });
  }

  function agregarCorreo() {
    var valor = inputNuevo.value.trim();
    mostrarError("");
    if (!valor) return;
    if (!inputNuevo.checkValidity()) { mostrarError("Escribe un correo válido."); return; }
    var existe = correos.some(function (c) { return c.correo.toLowerCase() === valor.toLowerCase(); });
    if (existe) { mostrarError("Ese correo ya está en la lista."); return; }
    correos.push({ correo: valor, marcado: true });
    inputNuevo.value = "";
    dibujarLista();
  }

  document.getElementById("btnAgregar").addEventListener("click", agregarCorreo);
  inputNuevo.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); agregarCorreo(); }
  });

  // Antes de enviar: junta los correos marcados y los pone en el campo _cc
  document.getElementById("formulario").addEventListener("submit", function () {
    var marcados = correos.filter(function (c) { return c.marcado; })
                          .map(function (c) { return c.correo; });
    document.getElementById("cc").value = marcados.join(",");
  });

  dibujarLista();
</script>

</body>
</html>
